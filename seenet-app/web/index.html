<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SeeNet - Sistema de diagnóstico técnico e gestão de ordens de serviço">
  <meta name="theme-color" content="#111111">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SeeNet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SeeNet</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Visualizador de PDF (relatório de EPI, APR, ficha da OS).

    No WEB o pacote `printing` renderiza com PDF.js, que ele baixa sozinho de
    unpkg.com em tempo de execução. Isso quebrava o relatório de EPI: navegador
    com bloqueio de rastreadores (Brave, uBlock) barra CDN de terceiros e a tela
    mostrava só "Unable to display the document" — sem erro nenhum, porque o PDF
    em si chegava certo do servidor.

    Servindo os arquivos junto com o app, não existe mais terceiro pra bloquear
    (e também não depende do unpkg estar no ar, o que importa pro técnico em
    rede ruim). A pasta é `pdfjs/` e não `assets/` de propósito: `assets/` é
    onde o Flutter põe os assets dele.
  -->
  <script>
    var dartPdfJsBaseUrl = "pdfjs/3.2.146/";
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
